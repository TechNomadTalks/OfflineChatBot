[api_keys]
# IMPORTANT: Replace these with your actual API keys
# Leave as placeholder if not using that service
openai = YOUR_OPENAI_API_KEY_HERE
elevenlabs = YOUR_ELEVENLABS_API_KEY_HERE
zai = YOUR_ZAI_API_KEY_HERE

[ai]
# model can be gpt-4o, gpt-4o-mini, glm-5.1 (Z.AI), or a local model like phi-3
model = glm-5.1
# Set to true to use local AI by default (no API calls)
offline_mode = false

[tts]
# TTS provider: elevenlabs, piper, or pyttsx3
provider = piper
# ElevenLabs voice ID (British male, Jarvis-like)
voice_id = pMsXgV2OhLO1IsvrKWfX
stability = 0.4
similarity_boost = 0.8

[personality]
# Personality profile: jarvis, nova, or casual
profile = jarvis
# AI temperature (0.0-1.0)
temperature = 0.7

[object_recognition]
# model can be yolov8n.pt, yolov8s.pt, yolov8m.pt, etc.
model = yolov8n.pt

[voice]
# Enable or disable voice output
enabled = true

[memory]
# Enable conversation memory
enabled = true
max_entries = 50

[proactive]
# Enable proactive messages
enabled = true
min_interval = 180
max_interval = 300
max_memory_entries = 5

[permissions]
# Plugin command permissions: plugin_name = allowed_commands_comma_separated
# Special commands: scan, upload, open, search, shutdown, restart, clear, voice, mode, export, import, find, look, plan
# Empty = all allowed
# Example: myplugin = scan,open,search
autonomous = scan,upload,open,search,export,import,find,look,plan
