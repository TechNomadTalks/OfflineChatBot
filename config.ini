[api_keys]
# IMPORTANT: Replace these with your actual API keys
# Leave as placeholder if not using that service
openai = YOUR_OPENAI_API_KEY_HERE
elevenlabs = YOUR_ELEVENLABS_API_KEY_HERE

[ai]
# model can be gpt-4o, gpt-4o-mini, or a local model like phi-3
model = phi-3
# Set to true to use local AI by default (no API calls)
offline_mode = true

[object_recognition]
# model can be yolov8n.pt, yolov8s.pt, yolov8m.pt, etc.
model = yolov8n.pt

[voice]
# Enable or disable voice output
enabled = true

[memory]
# Enable conversation memory
enabled = true
max_entries = 50

[proactive]
# Enable proactive messages
enabled = true
